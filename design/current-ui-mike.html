<script type="text/babel" data-presets="react,env">
const {useState,useRef,useCallback,useMemo,useEffect}=React;

function notesFraisReadFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function notesFraisPrepareUpload(file){
  const maxBytes=2.6*1024*1024;
  if(!file||!file.size||file.size<=maxBytes)return file;
  if(!file.type||!file.type.startsWith('image/')){
    throw new Error('Ce fichier depasse la limite de 2.6 Mo. Les photos sont compressees automatiquement, mais ce PDF doit etre reduit.');
  }
  let bitmap;
  let objectUrl='';
  try{
    bitmap=await new Promise((resolve,reject)=>{
      if(window.createImageBitmap){
        createImageBitmap(file).then(resolve).catch(()=>{
          const img=new Image();
          objectUrl=URL.createObjectURL(file);
          img.onload=()=>resolve(img);
          img.onerror=reject;
          img.src=objectUrl;
        });
      }else{
        const img=new Image();
        objectUrl=URL.createObjectURL(file);
        img.onload=()=>resolve(img);
        img.onerror=reject;
        img.src=objectUrl;
      }
    });
    const width=bitmap.width||bitmap.naturalWidth;
    const height=bitmap.height||bitmap.naturalHeight;
    if(!width||!height)throw new Error('Dimensions de photo invalides');
    const baseName=(file.name||'receipt').replace(/\.[^.]+$/,'');
    const attempts=[
      {side:2200,quality:.82},
      {side:1900,quality:.74},
      {side:1600,quality:.68},
      {side:1400,quality:.60}
    ];
    for(const attempt of attempts){
      const scale=Math.min(1,attempt.side/Math.max(width,height));
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(width*scale));
      canvas.height=Math.max(1,Math.round(height*scale));
      const context=canvas.getContext('2d');
      context.fillStyle='#fff';
      context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(bitmap,0,0,canvas.width,canvas.height);
      const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',attempt.quality));
      if(blob&&blob.size<=maxBytes){
        return new File([blob],baseName+'-optimized.jpg',{type:'image/jpeg',lastModified:Date.now()});
      }
    }
    throw new Error('La photo reste trop lourde apres compression');
  }catch(error){
    throw new Error('Impossible de compresser cette photo. Essayez une capture d ecran du receipt.');
  }finally{
    if(bitmap&&bitmap.close)bitmap.close();
    if(objectUrl)URL.revokeObjectURL(objectUrl);
  }
}
async function notesFraisApi(path,options){
  const controller=new AbortController();
  const timeoutMs=(options&&options.timeoutMs)||30000;
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  let response;
  try{
    response=await fetch(path,{credentials:'same-origin',...(options||{}),signal:controller.signal,headers:{'Content-Type':'application/json',...((options&&options.headers)||{})}});
  }catch(error){
    if(error&&error.name==='AbortError')throw new Error('Upload trop long. Reessayez avec une photo plus legere ou un PDF plus petit.');
    throw error;
  }finally{
    clearTimeout(timer);
  }
  const data=await response.json().catch(()=>({}));
  if(!response.ok||data.ok===false){
    const err=new Error(data.error||('HTTP '+response.status));
    err.status=response.status;
    throw err;
  }
  return data;
}
function notesFraisFilterParams(filters){
  const params=new URLSearchParams();
  const gte=filters.find(f=>f.op==='gte'&&f.column==='date');
  const lte=filters.find(f=>f.op==='lte'&&f.column==='date');
  if(gte)params.set('from',gte.value);
  if(lte)params.set('to',lte.value);
  return params;
}
function nfIsoDay(value){
  if(!value)return value;
  if(value instanceof Date)return value.toISOString().slice(0,10);
  const text=String(value);
  return /^\d{4}-\d{2}-\d{2}T/.test(text)?text.slice(0,10):text;

function nfNormalizeRow(row){
  if(!row||typeof row!=='object')return row;
  const out={...row};
  if('date' in out)out.date=nfIsoDay(out.date);
  if('ubs_date' in out)out.ubs_date=nfIsoDay(out.ubs_date);
  return out;

// Neon renvoie les colonnes 'date' en horodatage ISO complete, la ou Supabase

// disparaissait de la vue, du total et de la soumission.

  if(Array.isArray(data))return data.map(nfNormalizeRow);
  return nfNormalizeRow(data);
}
function makeNotesFraisBuilder(table){
  const state={table,action:'select',filters:[],values:null,single:false,maybeSingle:false};
  const builder={
    select(){state.action=state.action==='insert'?'insert':'select';return builder;},
    gte(column,value){state.filters.push({op:'gte',column,value});return builder;},
    lte(column,value){state.filters.push({op:'lte',column,value});return builder;},
    eq(column,value){state.filters.push({op:'eq',column,value});return builder;},
    in(column,values){state.filters.push({op:'in',column,values});return builder;},
    order(){return builder;},
    insert(values){state.action='insert';state.values=values;return builder;},
    update(values){state.action='update';state.values=values;return builder;},
    delete(){state.action='delete';return builder;},
    single(){state.single=true;return builder.execute();},
    maybeSingle(){state.maybeSingle=true;return builder.execute();},
    then(resolve,reject){return builder.execute().then(resolve,reject);},
    catch(reject){return builder.execute().catch(reject);},
    async execute(){
      try{
        if(table==='app_profiles'){
          const session=await notesFraisApi('/api/session');
          const data=session.profile||null;
          return {data,error:null};
        }
        if(table!=='expenses')throw new Error('Table non supportee: '+table);
        if(state.action==='select'){
          const params=notesFraisFilterParams(state.filters);
          const out=await notesFraisApi('/api/expenses?'+params.toString());
          return {data:nfNormalizeData(out.data||[]),error:null};
        }
        if(state.action==='insert'){
          const value=Array.isArray(state.values)?state.values[0]:state.values;
          const out=await notesFraisApi('/api/expenses',{method:'POST',body:JSON.stringify(value)});
          return {data:nfNormalizeData(out.data),error:null};
        }
        if(state.action==='update'){
          const idFilter=state.filters.find(f=>f.op==='eq'&&f.column==='id');
          const inFilter=state.filters.find(f=>f.op==='in'&&f.column==='id');
          const payload={values:state.values};
          if(idFilter)payload.id=idFilter.value;
          if(inFilter)payload.ids=inFilter.values;
          const out=await notesFraisApi('/api/expenses',{method:'PATCH',body:JSON.stringify(payload)});
          return {data:nfNormalizeData(out.data),error:null};
        }
        if(state.action==='delete'){
          const idFilter=state.filters.find(f=>f.op==='eq'&&f.column==='id');
          const params=new URLSearchParams({id:String(idFilter&&idFilter.value||'')});
          const out=await notesFraisApi('/api/expenses?'+params.toString(),{method:'DELETE'});
          return {data:nfNormalizeData(out.data),error:null};
        }
      }catch(error){
        return {data:null,error};
      }
    }
  };
  return builder;
}

function nfBase64Encode(value){

function nfBase64Decode(value){

/* OFFLINE QUEUE */
const OFFLINE_DB='notesfrais-offline-v1';
const OFFLINE_STORE='expenses';
function openOfflineDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(OFFLINE_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(OFFLINE_STORE))db.createObjectStore(OFFLINE_STORE,{keyPath:'id'});};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
async function fileToOffline(file){
  if(!file)return null;
  const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file);});
  return{name:file.name,type:file.type,lastModified:file.lastModified,data};
}
function offlineToFile(saved){
  if(!saved)return null;
  const parts=String(saved.data).split(',');
  const meta=parts[0]||'',body=parts[1]||'';
  const mime=(meta.match(/data:(.*?);base64/)||[])[1]||saved.type||'application/octet-stream';
  const bin=atob(body);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new File([bytes],saved.name||'receipt',{type:mime,lastModified:saved.lastModified||Date.now()});
}
async function queueOfflineExpense(expense,file){
  const savedFile=await fileToOffline(file);
  const db=await openOfflineDb();
  const tx=db.transaction(OFFLINE_STORE,'readwrite');
  tx.objectStore(OFFLINE_STORE).add({id:Date.now()+'_'+Math.random().toString(36).slice(2),channel:window.NOTESFRAIS_CHANNEL||'main',expense,file:savedFile,createdAt:new Date().toISOString()});
  await txDone(tx);
}
async function getOfflineExpenses(){
  const db=await openOfflineDb();
  const tx=db.transaction(OFFLINE_STORE,'readonly');
  const req=tx.objectStore(OFFLINE_STORE).getAll();
  const items=await new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});
  await txDone(tx);
  return items.filter(item=>(item.channel||'mike')===(window.NOTESFRAIS_CHANNEL||'main')).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
}
async function deleteOfflineExpense(id){
  const db=await openOfflineDb();
  const tx=db.transaction(OFFLINE_STORE,'readwrite');
  tx.objectStore(OFFLINE_STORE).delete(id);
  await txDone(tx);
}
async function getOfflineCount(){return (await getOfflineExpenses()).length;}
async function syncOfflineExpenses(onSaved){
  if(!navigator.onLine)return 0;
  const items=await getOfflineExpenses();
  let synced=0;
  for(const item of items){
    let expense={...item.expense};
    const file=offlineToFile(item.file);
    if(file){
      const uploaded=await uploadReceipt(file);
      expense={...expense,receiptPath:uploaded.path,receiptName:uploaded.name||expense.receiptName||file.name};
    }
    const saved=await insertExpense(expense);
    await deleteOfflineExpense(item.id);
    synced++;
    if(onSaved)onSaved(saved);
  }
  return synced;
}

/* UBS PARSER */
function parseUBS(raw){
  const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  let hi=0;
  for(let i=0;i<Math.min(10,lines.length);i++){
    const l=lines[i].toLowerCase();
    if(l.includes('datum')||l.includes('buchungstext')||l.includes('libellé')||l.includes('amount')||l.includes('montant')){hi=i;break;}
  }
  const hh=spl(lines[hi]).map(h=>h.toLowerCase().trim());
  const col={date:fc(hh,['datum','date']),label:fc(hh,['buchungstext','libellé','description','text']),amount:fc(hh,['betrag','montant','amount']),currency:fc(hh,['währung','devise','currency'])};
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    const c=spl(lines[i]);if(c.length<3)continue;
    const date=pd(c[col.date]??'');const amount=pn(c[col.amount]??'');
    if(!date||isNaN(amount))continue;
    rows.push({date,label:(c[col.label]??'').trim(),amount,currency:(c[col.currency]??'CHF').trim()||'CHF'});
  }
  let info='';
  if(hi>0)info=lines.slice(0,hi).map(l=>spl(l).join(' ').trim()).filter(l=>l.length>2).join(' · ');
  return{rows,info};
}
function fc(h,c){for(const x of c){const i=h.findIndex(k=>k.includes(x));if(i>=0)return i;}return -1;}
function spl(line){const r=[];let cur='',q=false;for(const ch of line){if(ch==='"'){q=!q;continue;}if(ch===';'&&!q){r.push(cur);cur='';continue;}cur+=ch;}r.push(cur);return r;}
function pd(s){s=s.trim();const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;return null;}
function pn(s){s=s.trim().replace(/'/g,'').replace(/\s/g,'');if(!s||s==='-')return NaN;return parseFloat(s);}
function normLabel(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function tokenizeLabel(s){return normLabel(s).split(' ').filter(t=>t.length>=3);}
function labelsClose(a,b){
  const ta=tokenizeLabel(a),tb=tokenizeLabel(b);
  if(ta.length===0||tb.length===0)return false;
  const sa=new Set(ta),sb=new Set(tb);
  let common=0;
  for(const t of sa){if(sb.has(t))common++;}
  if(common>=2)return true;
  if(common===1){
    const strong=['uber','sbb','cff','ibis','restaurant','brasserie','netflix','coop','migros','amazon','easyjet','manor'];
    return [...sa].some(t=>sb.has(t)&&strong.includes(t));
  }
  const joinedA=ta.join(' '),joinedB=tb.join(' ');
  return joinedA.includes(joinedB)||joinedB.includes(joinedA);
}
function labelScore(a,b){
  const ta=tokenizeLabel(a),tb=tokenizeLabel(b);
  if(ta.length===0||tb.length===0)return 0;
  const sa=new Set(ta),sb=new Set(tb);
  let common=0;
  for(const t of sa){if(sb.has(t))common++;}
  const base=common/Math.max(sa.size,sb.size);
  const joinedA=ta.join(' '),joinedB=tb.join(' ');
  if(joinedA===joinedB)return 1;
  if(joinedA.includes(joinedB)||joinedB.includes(joinedA))return Math.max(base,0.9);
  return base;
}

/* RECONCILIATION */
function reconcile(expenses,ubsRows){
  const matched=new Set();
  const updated=expenses.map(exp=>{
    const ea=Math.abs(exp.amountCHF||exp.amount),ed=new Date(exp.date);
    let bestIdx=-1,bestScore=-1,bestRow=null;
    for(let i=0;i<ubsRows.length;i++){
      if(matched.has(i))continue;
      const r=ubsRows[i];if(r.amount>=0)continue;
      const ra=Math.abs(r.amount),dd=Math.abs((ed-new Date(r.date))/86400000),ap=ra>0?Math.abs(ea-ra)/ra:1;
      if(dd<=2&&ap<=0.05&&labelsClose(exp.merchant,r.label)){
        const score=(labelScore(exp.merchant,r.label)*1000)-dd*10-ap*100;
        if(score>bestScore){bestScore=score;bestIdx=i;bestRow=r;}
      }
    }
    if(bestIdx>=0){matched.add(bestIdx);return{...exp,status:'reconciled',ubsRow:bestRow,amtDiff:Math.abs(ea-Math.abs(bestRow.amount))>0.005?Math.abs(bestRow.amount)-ea:0};}
    return {...exp,status:'pending',ubsRow:null,amtDiff:0};
  });
  return{expenses:updated,forgotten:ubsRows.filter((r,i)=>!matched.has(i)&&r.amount<0)};
}

async function compressReceiptImageForTest(file){
  if(!file||!file.type||!file.type.startsWith('image/'))return file;
  const maxSide=1800;
  const quality=0.78;
  const originalSize=file.size||0;
  try{
    const bitmap=await new Promise((resolve,reject)=>{
      if(window.createImageBitmap){
        createImageBitmap(file).then(resolve).catch(()=>{
          const img=new Image();
          img.onload=()=>resolve(img);
          img.onerror=reject;
          img.src=URL.createObjectURL(file);
        });
      }else{
        const img=new Image();
        img.onload=()=>resolve(img);
        img.onerror=reject;
        img.src=URL.createObjectURL(file);
      }
    });
    const width=bitmap.width||bitmap.naturalWidth;
    const height=bitmap.height||bitmap.naturalHeight;
    if(!width||!height)return file;
    const scale=Math.min(1,maxSide/Math.max(width,height));
    const targetWidth=Math.max(1,Math.round(width*scale));
    const targetHeight=Math.max(1,Math.round(height*scale));
    const canvas=document.createElement('canvas');
    canvas.width=targetWidth;
    canvas.height=targetHeight;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,targetWidth,targetHeight);
    ctx.drawImage(bitmap,0,0,targetWidth,targetHeight);
    if(bitmap.close)bitmap.close();
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));
    if(!blob)return file;
    if(originalSize&&blob.size>=originalSize*0.92)return file;
    const baseName=(file.name||'receipt').replace(/\.[^.]+$/,'');
    return new File([blob],baseName+'-optimise.jpg',{type:'image/jpeg',lastModified:Date.now()});
  }catch(e){
    console.warn('Compression receipt indisponible, fichier original conserve',e);
    return file;
  }
}
window.__notesfraisCompressReceiptImageForTest=compressReceiptImageForTest;

        for(let i=0;i<d.length;i+=4){

    </>}
  </div>;

const NOTESFRAIS_SUBMISSION_BADGE_TEST_V6=true;
function getCurrentSubmissionMonthKey(){
  const now=new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
}
function getSubmissionStatusForMonth(month,items){
  const list=Array.isArray(items)?items:[];
  if(list.length>0&&list.every(e=>(e.submissionStatus||'pending')==='submitted'))return 'submitted';
  return month<getCurrentSubmissionMonthKey()?'to_submit':'pending';
}
function getSubmissionStatusBadge(status){
  if(status==='submitted')return{label:'Submitted',hint:'sent to finance',bg:'var(--gl)',color:'var(--green)',border:'#BDEAD9'};
  if(status==='to_submit')return{label:'To submit',hint:'month completeee',bg:'var(--aml)',color:'var(--amber)',border:'#F0D391'};
  return{label:'In progress',hint:'entry in progress',bg:'var(--al)',color:'var(--accent)',border:'#C7D5FF'};
}
function titleCaseName(value){
  return String(value||'').replace(/[._-]+/g,' ').trim().split(/\s+/).filter(Boolean).map(part=>part.charAt(0).toUpperCase()+part.slice(1).toLowerCase()).join(' ');
}
async function getSubmissionUserIdentity(){
  try{
    const {data}=await sb.auth.getUser();
    const user=data&&data.user?data.user:null;
    const meta=user&&user.user_metadata?user.user_metadata:{};
    const email=user&&user.email?user.email:'';
    const name=meta.full_name||meta.name||meta.display_name||titleCaseName(String(email).split('@')[0])||'Utilisateur';
    return {userName:name,userEmail:email};
  }catch(e){
    return {userName:'Utilisateur',userEmail:''};
  }
}
async function notifyFinanceSubmission(payload){
  const response=await fetch('/api/notify-submission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||data.ok===false)throw new Error(data.error||'Notification email impossible');
  return data;
}

function normalizeReceiptItems(value){
  let raw=value;
  if(typeof raw==='string'){
    try{raw=JSON.parse(raw);}catch(_e){raw=[];}
  }
  if(!Array.isArray(raw))raw=[];
  return raw.map(item=>({path:String((item&&(item.path||item.url||item.receiptPath||item.receipt_url))||'').trim(),name:String((item&&(item.name||item.receiptName||item.receipt_name))||'receipt').trim()||'receipt'})).filter(item=>item.path);
}
function receiptItemsForExpense(expense){
  const items=normalizeReceiptItems(expense&&expense.receiptItems);
  const fallback=expense&&(expense.receiptPath||expense.receiptUrl)?[{path:expense.receiptPath||expense.receiptUrl,name:expense.receiptName||'receipt'}]:[];
  const seen=new Set();
  return [...items,...fallback].filter(item=>{
    const key=item.path;
    if(!key||seen.has(key))return false;
    seen.add(key);
    return true;
  });
}
function primaryReceiptItem(expense){

function fwFinanceReceiptItems(e){return receiptItemsForExpense(e);}function fwFinanceReceiptValue(e){const first=fwFinanceReceiptItems(e)[0];return first?first.path:'';}function fwFinanceReceiptName(e){const first=fwFinanceReceiptItems(e)[0];return first?first.name:(e.receiptName||'receipt');}function fwFinanceReceiptCount(e){return fwFinanceReceiptItems(e).length;}
function fwFinanceCardLabel(e){return typeof getPaymentCardLabel==='function'?(getPaymentCardLabel(e.note)||'Missing card'):'Missing card';}
function fwFinanceIssueList(e){
  const issues=[];
  if(!fwFinanceReceiptValue(e))issues.push({label:'No receipt',tone:'red'});
  if((e.status||'pending')!=='reconciled')issues.push({label:'UBS pending',tone:'amber'});

function fwFinanceCsvCell(value){
  const text=String(value==null?'':value).replace(/\r?\n/g,' ');

}
function fwDownloadFinanceCsv(items,label){
  const rows=[['Date','Merchant','Category','Card','Amount CHF','VAT CHF','UBS status','Receipt','Notes','Submission status']];
  (items||[]).forEach(e=>rows.push([
    fd(e.date),
    e.merchant||'',
    (CMAP[e.category]&&CMAP[e.category].label)||e.category||'',
    fwFinanceCardLabel(e),
    Number(e.amountCHF||e.amount||0).toFixed(2),
    Number(e.tva||0).toFixed(2),
    e.status||'pending',
    fwFinanceReceiptValue(e)?'yes':'no',
    typeof cleanPaymentCardNote==='function'?cleanPaymentCardNote(e.note):e.note||'',
    e.submissionStatus||'pending'
  ]));
  const csv=rows.map(row=>row.map(fwFinanceCsvCell).join(';')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');

  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

function safeZipPart(value){
  return String(value||'sans-nom').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70)||'sans-nom';
}
function receiptExtension(expense){
  const source=String(expense.receiptName||expense.receiptPath||expense.receiptUrl||'').split('?')[0];
  const m=source.match(/\.([a-zA-Z0-9]{2,6})$/);
  return m?m[1].toLowerCase():'jpg';
}
function zipReceiptDate(value){
  const text=String(value||'date');
  const m=text.match(/^\d{4}-\d{2}-\d{2}/);
  return m?m[0]:safeZipPart(text);
}
function zipReceiptBaseName(value){
  return safeZipPart(String(value||'receipt').replace(/\.[a-zA-Z0-9]{2,6}$/,''));
}
async function ensureNotesFraisZip(){
  if(window.JSZip)return window.JSZip;
  await new Promise((resolve,reject)=>{
    const existing=document.querySelector('script[data-notesfrais-jszip]');
    if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return;}
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    s.async=true;
    s.dataset.notesfraisJszip='true';
    s.onload=resolve;
    s.onerror=reject;
    document.head.appendChild(s);
  });
  return window.JSZip;
}
async function downloadFinanceReceiptsZip(expenses,label,setBusy){
  const receiptRows=(expenses||[]).flatMap(expense=>receiptItemsForExpense(expense).map((receipt,receiptIndex)=>({expense,receipt,receiptIndex})));
  if(receiptRows.length===0)return;
  setBusy(true);
  try{
    const JSZip=await ensureNotesFraisZip();
    const zip=new JSZip();
    const failures=[];
    for(let i=0;i<receiptRows.length;i++){
      const {expense:e,receipt,receiptIndex}=receiptRows[i];
      try{
        const value=receipt.path;
        const path=typeof extractReceiptPath==='function'?extractReceiptPath(value):(!/^https?:\/\//i.test(String(value||''))?value:null);
        const url=path?('/api/receipts?raw=1&path='+encodeURIComponent(path)+'&name='+encodeURIComponent(receipt.name||'receipt')):(/^https?:\/\//i.test(String(value||''))?value:null);
        if(!url)throw new Error('Chemin de receipt non recoverable');
        const res=await fetch(url);
        if(!res.ok)throw new Error('HTTP '+res.status);
        const blob=await res.blob();
        const ext=receiptExtension({receiptName:receipt.name,receiptPath:receipt.path});
        const name=[String(i+1).padStart(2,'0'),zipReceiptDate(e.date),safeZipPart(e.merchant),'receipt-'+String(receiptIndex+1),zipReceiptBaseName(receipt.name||'receipt')].filter(Boolean).join('_')+'.'+ext;
        zip.file(name,blob);
      }catch(err){
        failures.push((e.date||'date')+' - '+(e.merchant||receipt.name||('receipt '+(i+1)))+' - '+(err.message||err));
      }
    }
    if(Object.keys(zip.files).length===0){
      zip.file('_A_LIRE_erreurs.txt','No receipt telechargeable pour cette periode.\n\n'+failures.join('\n'));
    }else if(failures.length>0){
      zip.file('_A_LIRE_erreurs.txt','Receipts non receiptperes:\n'+failures.join('\n'));
    }
    const content=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');
    const url=URL.createObjectURL(content);
    a.href=url;
    a.download='receipts_'+safeZipPart(label)+'.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  }catch(err){
    alert('Impossible de creer le ZIP des receipts: '+(err.message||err));
  }finally{
    setBusy(false);
  }
}

function userExpensePaymentCard(note){
  const value=String(note||'');
  const raw=(value.match(/(?:Carte utilisee|Card used|Payment card):\s*(entreprise|perso|company|personal)/i)||[])[1]||'';
  return /entreprise|company/i.test(raw)?'entreprise':/perso|personal/i.test(raw)?'perso':'';
}
function userExpenseMealWith(note,category){
  const value=String(note||'');
  const explicit=((value.match(/^(?:With|Avec):\s*(.+)$/im)||[])[1]||'').trim();
  if(explicit||category!=='repas')return explicit;
  return (value.split(/\n+/).map(line=>line.trim()).find(line=>
    line&&!/^(?:Carte utilisee|Card used|Payment card):/i.test(line)
  )||'').trim();
}
function userExpenseCleanNote(note,category){
  const mealWith=userExpenseMealWith(note,category);
  let removedLegacyMeal=false;
  return String(note||'').split(/\n+/).map(line=>line.trim()).filter(line=>{
    if(!line||/^(?:Carte utilisee|Card used|Payment card):/i.test(line)||/^(?:With|Avec):/i.test(line))return false;
    if(category==='repas'&&mealWith&&!removedLegacyMeal&&line===mealWith){removedLegacyMeal=true;return false;}
    return true;
  }).join('\n');
}
async function updateUserExpense(id,values){
  const {data,error}=await sb.from('expenses').update(values).eq('id',id);
  if(error)throw error;
  const row=Array.isArray(data)?data[0]:data;
  return typeof nr==='function'?nr(row):row;
}

function AccessGate({children}){
  const [authSession,setAuthSession]=useState(null);
  const [profile,setProfile]=useState(null);
  const [checkingAuth,setCheckingAuth]=useState(true);
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [error,setError]=useState('');
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    try{localStorage.removeItem('notesfrais_access');}catch(e){}
    let alive=true;
    sb.auth.getSession().then(({data})=>{if(alive)setAuthSession(data&&data.session?data.session:null);}).finally(()=>{if(alive)setCheckingAuth(false);});
    const {data:{subscription}}=sb.auth.onAuthStateChange((_event,session)=>{setAuthSession(session||null);});
    return()=>{alive=false;subscription&&subscription.unsubscribe&&subscription.unsubscribe();};
  },[]);

  useEffect(()=>{
    let alive=true;
    if(!authSession){setProfile(null);return;}
    setBusy(true);
    sb.from('app_profiles').select('role,app_channel').eq('user_id',authSession.user.id).maybeSingle()
      .then(({data,error})=>{
        if(!alive)return;
        if(error){setError('Profile not found or not authorized.');setProfile(null);return;}
        setProfile(data||null);
      })
      .finally(()=>{if(alive)setBusy(false);});
    return()=>{alive=false;};
  },[authSession]);

  const activeRole=profile&&profile.role?profile.role:null;
  useEffect(()=>{window.notesFraisRole=activeRole||null;window.notesFraisProfile=profile||null;},[activeRole,profile]);

  const loginPassword=async()=>{
    setError('');setBusy(true);
    try{
      const {error}=await sb.auth.signInWithPassword({email:String(email||'').trim(),password});
      if(error)throw error;
      try{localStorage.removeItem('notesfrais_access');}catch(e){}
      setPassword('');
    }catch(e){setError(e.message||'Unable to sign in.');}
    finally{setBusy(false);}
  };

  const logout=async()=>{
    try{localStorage.removeItem('notesfrais_access');}catch(e){}
    await sb.auth.signOut().catch(()=>{});
    window.notesFraisRole=null;
    window.notesFraisProfile=null;
    setAuthSession(null);
    setProfile(null);
    setPassword('');
  };

  if(checkingAuth){
    return <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',color:'var(--t2)',fontSize:14}}>Checking access...</div>;
  }

  if(authSession&&busy&&!profile){
    return <div style={{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',color:'var(--t2)',fontSize:14}}>Loading profile...</div>;
  }

  if(authSession&&profile){
    window.notesFraisRole=profile.role;window.notesFraisProfile=profile;
    return <>
      {children}
      <button onClick={logout} title="Change access" style={{position:'fixed',top:12,right:12,zIndex:2600,border:'0.5px solid rgba(26,26,26,0.08)',background:'rgba(255,255,255,0.92)',backdropFilter:'blur(10px)',color:'var(--t2)',borderRadius:999,padding:'7px 10px',fontSize:11,boxShadow:'0 8px 22px rgba(26,26,26,0.08)',cursor:'pointer'}}>{profile.role==='finance'?'Finance':'Mike'}</button>
    </>;
  }

  return <div style={{minHeight:'100dvh',background:'linear-gradient(135deg,#F5F3EF 0%,#EEF2FD 100%)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
    <div style={{width:'100%',maxWidth:430,background:'#fff',border:'0.5px solid var(--border)',borderRadius:22,padding:24,boxShadow:'0 24px 80px rgba(26,26,26,0.12)'}}>
      <div style={{background:'linear-gradient(135deg,#0B1F4D,#1A3FB5)',borderRadius:18,padding:'22px 18px',color:'#fff',textAlign:'center',marginBottom:20}}>
        <div style={{fontSize:11,letterSpacing:'0.22em',opacity:0.72,marginBottom:8}}>EXPENSES</div>
        <div style={{fontSize:24,fontWeight:800,letterSpacing:'0.08em'}}>NUMERIQ</div>
      </div>
      <h1 style={{fontSize:22,lineHeight:1.2,marginBottom:6}}>Secure access</h1>
      <p style={{fontSize:13,color:'var(--t2)',lineHeight:1.5,marginBottom:16}}>Sign in with your secure account.</p>
      <>
        <input value={email} onChange={e=>{setEmail(e.target.value);setError('');}} type="email" autoComplete="email" placeholder="Email" style={{...inp,fontSize:16,padding:'13px 14px',background:'#fff',marginBottom:10}} />
        <input value={password} onChange={e=>{setPassword(e.target.value);setError('');}} onKeyDown={e=>{if(e.key==='Enter')loginPassword();}} type="password" autoComplete="current-password" placeholder="Mot de passe" style={{...inp,fontSize:16,padding:'13px 14px',background:'#fff',marginBottom:10}} />
        {error&&<div style={{background:'var(--rl)',color:'var(--red)',borderRadius:10,padding:'9px 12px',fontSize:13,marginBottom:10}}>{error}</div>}
        <button onClick={loginPassword} disabled={busy} style={{...bP,width:'100%',justifyContent:'center',padding:'14px 18px',fontSize:15,opacity:busy?0.65:1}}>{busy?'Signing in...':'Sign in'}</button>
      </>
    </div>
  </div>;
}

er("/mike-sw.js",{scope:"/mike"}).catch(function(){});});});}})();</script><script id="notesfrais-sync-status">(function(){

  return new Promise((resolve,reject)=>{
